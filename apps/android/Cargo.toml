[package]
name = "dedale-android"
version = "0.1.1"
edition = "2021"

# cargo-quad-apk loads lib<last segment of package_name>.so but builds lib<bin name>.so:
# the binary name must stay equal to the last segment of package_name.
[[bin]]
name = "defense"
path = "src/main.rs"

[dependencies]
game-native.workspace = true
macroquad.workspace = true

[package.metadata.android]
version_code = 2
android_version = 35
target_sdk_version = 35
min_sdk_version = 26
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
fullscreen = true
res = "res"
icon = "@mipmap/ic_launcher"

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "sensorLandscape"
"android:exported" = "true"

# package_name and label are only inherited by a binary named like the package.
[[package.metadata.android.bin]]
name = "defense"
package_name = "fr.dedale.defense"
label = "Dedale Defense"
